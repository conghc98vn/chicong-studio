services:
  - type: web
    name: chicong-photo-studio
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: NODE_EXTRA_CA_CERTS
        value: ./certs/supabase-root-2021.crt
      - key: SITE_URL
        value: https://chicongphoto.vn
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: chicong-private
      - key: CF_BEACON_TOKEN
        value: fd0f089e6f094baca1d372c934fa801d
      - key: SETUP_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
