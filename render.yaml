services:
  - type: web
    name: chicong-photo-studio
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: NODE_EXTRA_CA_CERTS
        value: ./certs/supabase-root-2021.crt
      - key: SITE_URL
        value: https://chicongphoto.vn
      # Production media moved to private R2 on 2026-10-21; database remains Supabase.
      - key: MEDIA_STORAGE_PROVIDER
        value: r2
      - key: DATABASE_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: chicong-production
      - key: CF_BEACON_TOKEN
        value: fd0f089e6f094baca1d372c934fa801d
      - key: SETUP_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
